[project]
name = "quant-detective"
version = "0.1.0"
description = "Falsifiable equity research OS — Evidence Contracts, Validation Kernel, Time Machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "pytest>=8.0,<9",
  "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
# Optional integrations; canonical verification installs research for loader tests.
openbb = []
qlib = []
research = ["pandas==2.2.3", "numpy==2.3.5"]

[project.scripts]
qd-tm = "time_machine.cli:main"
qd-lab = "research_lab.cli:main"
qd-market = "market_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validation_kernel", "time_machine", "schemas", "research_lab", "market_data", "factors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel.force-include]
"contracts/factors/definitions_v1.json" = "factors/definitions_v1.json"
