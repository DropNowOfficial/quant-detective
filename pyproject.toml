[project]
name = "quant-detective"
version = "0.1.0"
description = "Falsifiable equity research OS — Evidence Contracts, Validation Kernel, Time Machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "pytest>=8.0,<9",
]

[project.optional-dependencies]
# Optional ADAPT layers — not required for make verify
openbb = []
qlib = []

[project.scripts]
qd-tm = "time_machine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validation_kernel", "time_machine", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
