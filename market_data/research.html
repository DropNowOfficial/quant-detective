<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research · Quant Detective</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1115;color:#edf2f3}body{margin:40px auto;max-width:1100px;padding:0 20px}a{color:#8dedbc}h1{font-weight:500}p{color:#a5b3bf;line-height:1.9}select{padding:10px;margin:6px;max-width:100%;background:#19232c;color:white;border:1px solid #3c4b57}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:25px 0}.card{padding:22px;border:1px solid #2d3843;background:#141c23;border-radius:8px}.card strong{display:block;font:28px monospace;margin-top:15px}pre{white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere;color:#a5b3bf}summary{cursor:pointer}label{display:inline-block}</style><a href="/">← 返回 LIVE SCREENER</a><h1>Research / Backtest</h1><p>原历史研究保留在这里。以下是冻结的日线代理实验，和当前分钟扫描规则分开；历史年化不能作为分钟信号的预期收益。</p><label>数据窗口 <select id="dataset"></select></label><label>规则与成本 <select id="scenario"></select></label><p id="description">正在读取已保存的派生研究结果…</p><div class="grid" id="metrics"></div><details><summary>检查本情形的完整统计</summary><pre id="evidence"></pre></details><p>完整研究包括来源差异、偏差、资金约束、成本、方法文献与可还原快照。<a href="https://github.com/DropNowOfficial/quant-detective/blob/research/ma5-lab-20261004/docs/research-guide.zh-CN.md" target="_blank" rel="noopener">打开原研究说明 ↗</a></p><p>当前分钟扫描采用 MINUTE_MA5_V1：5根均线、滚动60根VWAP、前20根均量与同周期相对强弱。它不等于完整HARNESS V2；当前页面的研究收益也不属于该分钟规则。</p><script>
(async()=>{const $=x=>document.getElementById(x);const pct=x=>typeof x==='number'?(x*100).toFixed(2)+'%':'—';try{const r=await fetch('/api/research-summary');const d=await r.json();if(!r.ok)throw Error(d.error||'研究摘要不可用');let selected;d.datasets.forEach((v,i)=>$('dataset').add(new Option(v.label||v.id,i)));function dataset(){selected=d.datasets[Number($('dataset').value)];$('scenario').innerHTML='';selected.scenarios.forEach((v,i)=>$('scenario').add(new Option(v.id||JSON.stringify(v.params||v.config||{}),i)));scenario();}function scenario(){const v=selected.scenarios[Number($('scenario').value)],m=v.metrics||v.portfolio?.metrics||{};$('description').textContent=`${selected.start} → ${selected.end} · 冻结历史诊断 · ${v.status||'DIAGNOSTIC_ONLY'}`;const vals=[['年化（历史价格收益）',pct(m.cagr)],['最大回撤',pct(m.max_drawdown)],['总收益',pct(m.total_return)],['已完成交易',m.completed_trades??'—']];$('metrics').replaceChildren(...vals.map(([name,value])=>{const e=document.createElement('div');e.className='card';e.textContent=name;const s=document.createElement('strong');s.textContent=value;e.appendChild(s);return e;}));$('evidence').textContent=JSON.stringify(v,null,2);}$('dataset').onchange=dataset;$('scenario').onchange=scenario;dataset();}catch(e){$('description').textContent=e.message;}})();
</script></html>
