name: postincident-schedule-canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postincident-schedule-canary.yml'
  schedule:
    - cron: '19,24,29,34,39,44,49,54,59,4,9,14 * * * *'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          date -u
