name: schedule-canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-canary.yml'
  schedule:
    # Explicit UTC minutes; no timezone extension, no range/step expression.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          date -u

      - name: Inspect repository Actions scheduling state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          echo "=== workflows ==="
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows"             --jq '.workflows[] | {id,name,path,state}'

          echo "=== schedule runs ==="
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=schedule&per_page=10"             --jq '{total_count, runs: [.workflow_runs[] | {id,name,path,event,status,conclusion,created_at}]}'

          echo "=== actions permissions ==="
          gh api "repos/${GITHUB_REPOSITORY}/actions/permissions" || true

          echo "=== default workflow permissions ==="
          gh api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" || true

          echo "=== actions policies ==="
          gh api -H "X-GitHub-Api-Version: 2026-03-10"             "repos/${GITHUB_REPOSITORY}/actions/policies" || true
