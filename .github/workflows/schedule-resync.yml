name: schedule-resync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-resync.yml'

permissions:
  actions: write
  contents: read

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disable and re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in market-watch.yml schedule-canary.yml; do
            echo "== $wf before =="
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf"               --jq '{id,name,path,state,updated_at}'

            gh api --method PUT               "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/disable"

            echo "== $wf disabled =="
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf"               --jq '{id,name,path,state,updated_at}'

            gh api --method PUT               "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/enable"

            echo "== $wf re-enabled =="
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf"               --jq '{id,name,path,state,updated_at}'
          done
