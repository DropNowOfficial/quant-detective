name: hosted-core-watch-fallback

on:
  schedule:
    # Redundant public-data fallback. VPS/broker runtime is primary.
    # Five-minute short jobs avoid a single missed long-job handoff creating
    # an hours-long blind spot. Offset from minute 0 to reduce peak-load risk.
    - cron: '2-57/5 4-19 * * 1-5'
      timezone: 'America/New_York'
    - cron: '2 20 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-core-watch-fallback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: One-shot core fallback scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QD_WATCH_OUTPUT: market-watch.json
        run: |
          uv run python -m market_data.cli watch --once --github-alerts

      - name: Write compact run summary
        if: always()
        shell: bash
        run: |
          if [ -f market-watch.json ]; then
            uv run python - <<'PY'
          import json, os
          data=json.load(open("market-watch.json", encoding="utf-8"))
          rows=[r for r in data.get("rows",[]) if r.get("state") not in {"WATCH","EXTENDED"}]
          regime=data.get("market_regime") or {}
          out=[
              "## Quant Detective Hosted Fallback",
              "",
              f"Generated: {data.get('generated_at_et')}",
              f"Coverage: {data.get('coverage_scope')} / market_wide={data.get('market_wide')}",
              f"Decision mode: {data.get('decision_mode')}",
              "",
          ]
          for r in rows[:25]:
              i=r.get("intraday",{})
              out.append(
                  f"- **{r['symbol']}** {r.get('state')} | "
                  f"{i.get('change_pct')}% | d5={i.get('d5_atr')} ATR | "
                  f"vs SPY={r.get('relative_change_vs_spy_pp')}pp | {r.get('reason')}"
              )
          out += ["", "Market regime: " + json.dumps(regime, ensure_ascii=False)]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(out)+"\n")
          PY
          fi
