name: hosted-core-watch-fallback

on:
  push:
    branches: [main]
    paths:
      - 'market_data/github_alerts.py'
      - '.github/workflows/market-watch.yml'
  schedule:
    # Redundant public-data fallback. The VPS watcher is a separate runtime.
    # Short five-minute jobs avoid an hours-long blind spot if one schedule is dropped.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 4-19 * * 1-5'
      timezone: 'America/New_York'
    - cron: '2 20 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-core-watch-fallback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: One-shot hosted fallback scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QD_WATCH_OUTPUT: market-watch.json
        run: |
          uv run python -m market_data.cli watch --once --github-alerts

      - name: Write compact run summary
        if: always()
        shell: bash
        run: |
          if [ -f market-watch.json ]; then
            uv run python - <<'PY'
          import json, os
          data=json.load(open("market-watch.json", encoding="utf-8"))
          rows=[r for r in data.get("rows",[]) if r.get("state") not in {"WATCH","EXTENDED"}]
          out=[
              "## Quant Detective Hosted Fallback",
              "",
              f"Generated: {data.get('generated_at_et')}",
              "Scope: configured core watchlist / public observation fallback",
              "",
          ]
          for r in rows[:25]:
              i=r.get("intraday",{})
              out.append(
                  f"- **{r['symbol']}** {r.get('state')} | "
                  f"{i.get('change_pct')}% | d5={i.get('d5_atr')} ATR | "
                  f"{r.get('reason')}"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(out)+"\n")
          PY
          fi
