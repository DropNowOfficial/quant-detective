name: deploy-self-hosted-market-watch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-market-watch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'DropNowOfficial/quant-detective' && github.repository_id == '1369484548' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, quant-detective]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Verify before deploy
        run: |
          make verify

      - name: Deploy through reviewed rollback-capable updater
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum deploy/update-production.sh | awk '{print $1}')"
          installed="$(sha256sum /usr/local/sbin/quant-detective-update | awk '{print $1}')"
          if [ "$expected" != "$installed" ]; then
            echo "Reviewed updater must be installed separately before deployment." >&2
            exit 2
          fi
          sudo /usr/local/sbin/quant-detective-update "$GITHUB_SHA"
