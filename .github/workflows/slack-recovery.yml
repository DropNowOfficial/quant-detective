name: manual-slack-fresh-recovery
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Preview or explicitly apply fresh-only recovery; never sends Slack'
        type: choice
        required: true
        default: preview
        options: [preview, apply]
permissions:
  contents: read
  issues: write
concurrency:
  group: hosted-core-watch-fallback
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.repository == 'DropNowOfficial/quant-detective' && github.repository_id == '1369484548' && github.ref == 'refs/heads/main' && vars.QD_SLACK_ENABLED == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QD_SLACK_ENABLED: ${{ vars.QD_SLACK_ENABLED }}
      QD_SLACK_LEDGER_ISSUE: ${{ vars.QD_SLACK_LEDGER_ISSUE }}
      QD_SLACK_PRODUCER_IDS: ${{ vars.QD_SLACK_PRODUCER_IDS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --frozen
      - name: Read-only preview and backup
        run: uv run python -m market_data.slack_recovery preview > slack-recovery-preview.json
      - name: Preserve backup before any mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slack-recovery-before-${{ github.run_id }}
          path: |
            slack-recovery-backup.json
            slack-recovery-preview.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply explicitly requested fresh-only recovery
        if: ${{ inputs.operation == 'apply' }}
        run: uv run python -m market_data.slack_recovery apply > slack-recovery-result.json
      - name: Preserve result
        if: ${{ always() && inputs.operation == 'apply' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slack-recovery-result-${{ github.run_id }}
          path: slack-recovery-result.json
          if-no-files-found: warn
          retention-days: 30
