name: market-watch-smoke

on:
  pull_request:
    paths:
      - 'market_data/**'
      - 'tests/test_us_watch.py'
      - 'tests/test_quote_validity.py'
      - 'tests/test_market_watch_smoke.py'
      - '.github/workflows/market-watch*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --frozen
      - name: Scan NVDA TSM MSFT with current public data
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          if uv run python -m market_data.cli watch --once \
            --symbols "NVDA,TSM,MSFT" \
            --output market-watch-smoke.json; then
            status=0
          else
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Validate fresh data or expected closed-session rejection
        if: always()
        run: |
          uv run python -m market_data.smoke_check market-watch-smoke.json \
            --scan-exit-code "${{ steps.scan.outputs.exit_code }}"
      - name: Preserve full smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-watch-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-watch-smoke.json
          if-no-files-found: warn
          retention-days: 30
