name: market-watch-smoke

on:
  pull_request:
    paths:
      - 'market_data/**'
      - 'tests/test_us_watch.py'
      - '.github/workflows/market-watch*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --frozen
      - name: Scan cross-sector public sample with current data
        run: |
          uv run python -m market_data.cli watch --once \
            --symbols "NVDA,JPM,XOM,LLY,WMT,CAT,NEE,PLD,BA,UNH,COST,GS" \
            --output market-watch-smoke.json
      - name: Validate and summarize
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os
          data=json.load(open("market-watch-smoke.json", encoding="utf-8"))
          rows=data.get("rows", [])
          ok=[r for r in rows if r.get("status") == "OK"]
          if len(ok) < 8:
              raise SystemExit(f"public-data smoke coverage too low: {len(ok)}/12")
          if data.get("market_wide") is not False or data.get("coverage_scope") != "CORE_FALLBACK":
              raise SystemExit("public fallback coverage metadata is dishonest")
          context=data.get("market_context") or {}
          fresh=[v for v in context.values() if v.get("ok") and not v.get("stale")]
          if len(fresh) < 3:
              raise SystemExit("broad market context freshness too low")
          lines=["## Live smoke: cross-sector public sample", "", f"Generated: {data.get('generated_at_et')}"]
          for r in rows:
              i=r.get("intraday", {})
              lines.append(
                  f"- **{r['symbol']}** {r.get('state', r.get('status'))} | "
                  f"day={i.get('change_pct')}% | pre={i.get('premarket_change_pct')}% | "
                  f"gap={i.get('open_gap_pct')}% | d5={i.get('d5_atr')} ATR | "
                  f"RVOL={i.get('same_time_rvol')}"
              )
          lines.append("")
          lines.append("Market context: " + json.dumps(data.get("market_context", {}), ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
